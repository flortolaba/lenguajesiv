<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">
        <h2>Ubicación</h2>

        <div class="form-group">
            <label for="nombre-ubicacion">Nombre Ubicación</label>
            <input type="text" id="nombre-ubicacion" placeholder="Nombre Ubicación">
        </div>

        <div class="form-group">
            <label for="latitud">Latitud</label>
            <input type="text" id="latitud" placeholder="28,3537921">
        </div>

        <div class="form-group">
            <label for="longitud">Longitud</label>
            <input type="text" id="longitud" placeholder="-16,1234567">
        </div>

        <button id="btn-abrir">Abrir Ubicación</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
